all: false
dir: "{{.InterfaceDir}}"
filename: "{{ .InterfaceName | snakecase }}_moq_test.go"
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/TiraelSedai/PhotoChallengeBot
generate: true
include-auto-generated: false
log-level: info
pkgname: "{{.SrcPackageName}}"
recursive: false
require-template-schema-exists: true
structname: "Moq{{ .InterfaceName | firstUpper }}"
template: matryer
template-data:
  stub-impl: true
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/TiraelSedai/PhotoChallengeBot/internal/admin:
    interfaces:
      sessionStore:
      userStore:
      challengePlanner:
      challengeAnnouncements:
      announcementRenderer:
      createChallengePublisher:
      openChallengeFinder:
      photoDeleter:
      deletePhotoPublisher:
      finishVoteChallenges:
      finishVotePublisher:
      finishVoteResults:
      finishVoteTopics:
      adminMessageHandler:
      deletePhotoCommandHandler:
      finishVoteCommandHandler:
  github.com/TiraelSedai/PhotoChallengeBot/internal/app:
    interfaces:
      telegramRunner:
  github.com/TiraelSedai/PhotoChallengeBot/internal/bot:
    interfaces:
      mainChatHandler:
      adminChatHandler:
      privateStartHandler:
      callbackQueryHandler:
  github.com/TiraelSedai/PhotoChallengeBot/internal/challenge:
    interfaces:
      store:
  github.com/TiraelSedai/PhotoChallengeBot/internal/photo:
    interfaces:
      challenges:
      users:
      photos:
      publisher:
  github.com/TiraelSedai/PhotoChallengeBot/internal/results:
    interfaces:
      challengeStore:
      photoStore:
      voteStore:
      userStore:
      winnerStore:
      renderer:
      publisher:
  github.com/TiraelSedai/PhotoChallengeBot/internal/scheduler:
    interfaces:
      challenges:
      publisher:
      photoCounter:
      voteStartRenderer:
      resultsPublisher:
      topicReporter:
  github.com/TiraelSedai/PhotoChallengeBot/internal/tg:
    interfaces:
      client:
  github.com/TiraelSedai/PhotoChallengeBot/internal/topic:
    interfaces:
      reportChallenges:
      reportSuggestions:
      reportUsers:
      reportPublisher:
      challenges:
      users:
      suggestions:
  github.com/TiraelSedai/PhotoChallengeBot/internal/vote:
    interfaces:
      challengeStore:
      userStore:
      photoStore:
      voteStore:
      publisher:
